name: Deploy to EC2

on:
  # Dispara só depois que o workflow de build terminar.
  # O valor abaixo deve ser IGUAL ao campo "name:" do build-and-push.yml
  workflow_run:
    workflows: ["Build and Push to ECR"]
    types: [completed]
    branches: [main]
  # Deploy manual (usa o último commit da main)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-ec2
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1

jobs:
  deploy:
    # Só roda se o build foi bem-sucedido (ou se foi disparo manual)
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        env:
          DB_HOST: ${{ secrets.RDS_HOST }}
          DB_USER: ${{ secrets.RDS_USER }}
          DB_PASS: ${{ secrets.RDS_PASSWORD }}
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
          # Em workflow_run, github.sha NÃO é o commit do build; usar head_sha
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha || github.sha }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          port: 22
          script_stop: true
          command_timeout: 10m
          envs: DB_HOST,DB_USER,DB_PASS,ECR_REGISTRY,IMAGE_TAG,AWS_REGION
          script: |
            export DB_PORT=3306
            export DB_NAME=app_db

            bash /opt/deploy.sh "$ECR_REGISTRY" "$IMAGE_TAG"