name: Deploy to EC2

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          port: 22
          script: |
            export AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
            export AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
            export DB_HOST=${{ secrets.RDS_HOST }}
            export DB_PORT=3306
            export DB_NAME=app_db
            export DB_USER=${{ secrets.RDS_USER }}
            export DB_PASS=${{ secrets.RDS_PASSWORD }}
            
            bash /opt/deploy.sh ${{ secrets.ECR_REGISTRY }} ${{ github.sha }}

      - name: Verify deployment
        run: |
          sleep 10
          curl -f http://${{ secrets.EC2_HOST }}:8080/actuator/health || exit 1
          echo "✅ Application is healthy"